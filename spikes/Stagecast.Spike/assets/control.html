<!doctype html>
<meta charset="utf-8">
<title>Stagecast control test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 600 28px 'Segoe UI', sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; background: #1c4fd8; }
  .t { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; background: #f7c243; color: #000; display: grid; place-items: center; border: 0; font: 700 28px 'Segoe UI'; }
  #input { position: absolute; left: 200px; top: 200px; width: 600px; height: 60px; font-size: 32px; }
  #scroller { position: absolute; left: 1000px; top: 150px; width: 600px; height: 300px; overflow: auto; background: #333; }
  #scroller div { height: 3000px; background: linear-gradient(#333, #888); }
  #hover { position: absolute; left: 200px; top: 900px; width: 300px; height: 100px; background: #c50516; cursor: pointer; display: grid; place-items: center; }
  #flash { position: absolute; left: 600px; top: 900px; width: 300px; height: 100px; font-size: 32px; }
</style>
<div id="bg"></div>
<script>
  const pts = {}; let n = 0;
  for (const y of [60, 540, 1020]) for (const x of [60, 1260, 2460]) {
    const b = document.createElement('button'); b.className = 't'; b.id = 't' + (++n); b.textContent = n;
    b.style.left = x + 'px'; b.style.top = y + 'px'; document.body.appendChild(b); pts[b.id] = [x, y];
  }
  document.body.insertAdjacentHTML('beforeend',
    '<input id="input" placeholder="type here"><div id="scroller"><div></div></div><div id="hover">hover (pointer cursor)</div><button id="flash">flash</button>');
  const clicks = [];
  addEventListener('click', e => clicks.push([e.clientX, e.clientY, (e.target.id || e.target.tagName)]), true);
  document.getElementById('flash').addEventListener('click', () => {
    const bg = document.getElementById('bg'), red = !bg.dataset.red;
    bg.dataset.red = red ? '1' : ''; bg.style.background = red ? '#c50516' : '#1c4fd8';
  });
  window.state = () => JSON.stringify({
    clicks, input: document.getElementById('input').value, scrollTop: document.getElementById('scroller').scrollTop,
    w: innerWidth, h: innerHeight, dpr: devicePixelRatio, red: !!document.getElementById('bg').dataset.red });
  window.resetClicks = () => { clicks.length = 0; };
</script>
