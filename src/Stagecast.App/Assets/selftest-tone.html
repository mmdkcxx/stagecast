<!doctype html>
<meta charset="utf-8">
<title>Stagecast self test tone</title>
<style>html,body{margin:0;height:100%;background:#101418;color:#fff;font:700 48px 'Segoe UI',sans-serif;display:grid;place-items:center}</style>
<div id="s">starting tone</div>
<script>
  // 440 Hz sine at about -20 dBFS, played through the page's own audio so process loopback has something to capture.
  const ctx = new AudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 440; gain.gain.value = 0.1;
  osc.connect(gain).connect(ctx.destination); osc.start();
  ctx.resume().then(() => { document.getElementById('s').textContent = '440 Hz tone: ' + ctx.state; });
</script>
